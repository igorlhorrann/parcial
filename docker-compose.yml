
services:
  firewall:
    build: ./firewall
    container_name: firewall
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      funcionarios:
        ipv4_address: 172.30.1.254
      clientes:
        ipv4_address: 172.30.2.254
      dmz:
        ipv4_address: 172.30.3.254

  funcionario:
    image: alpine:latest
    container_name: funcionario
    cap_add:
      - NET_ADMIN
    command:
      - /bin/sh
      - -c
      - apk add --no-cache iproute2 curl && ip route add 172.30.3.0/24 via 172.30.1.254 && sleep infinity
    networks:
      funcionarios:
        ipv4_address: 172.30.1.10

  cliente:
    image: alpine:latest
    container_name: cliente
    cap_add:
      - NET_ADMIN
    command:
      - /bin/sh
      - -c
      - apk add --no-cache iproute2 curl && ip route add 172.30.3.0/24 via 172.30.2.254 && ip route add 172.30.1.0/24 via 172.30.2.254 && sleep infinity
    networks:
      clientes:
        ipv4_address: 172.30.2.10

  web:
    image: nginx:alpine
    container_name: web
    cap_add:
      - NET_ADMIN
    command:
      - /bin/sh
      - -c
      - apk add --no-cache iproute2 && ip route add 172.30.1.0/24 via 172.30.3.254 && ip route add 172.30.2.0/24 via 172.30.3.254 && exec nginx -g 'daemon off;'
    networks:
      dmz:
        ipv4_address: 172.30.3.10

  banco:
    image: postgres:16-alpine
    container_name: banco
    environment:
      POSTGRES_DB: frutaria
      POSTGRES_USER: frutaria
      POSTGRES_PASSWORD: frutaria_lab_123
    networks:
      funcionarios:
        ipv4_address: 172.30.1.20

networks:
  funcionarios:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24

  clientes:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.2.0/24

  dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.3.0/24